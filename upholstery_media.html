<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف السيارة - السروجي وتنجيد السيارات | مركز أوتو نون</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--border:#e2e8f0;--orange:#ea580c;--blue:#0284c7;--green:#10b981}
*{box-sizing:border-box;font-family:Segoe UI,Tahoma,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:18px}
.container{max-width:1100px;margin:auto}.header{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.title{color:var(--orange);font-size:1.35rem;font-weight:800}.sub{color:#64748b;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700;color:#fff}.blue{background:var(--blue)}.green{background:var(--green)}.dark{background:#334155}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px}.full{grid-column:1/-1}.card h3{margin:0 0 12px;color:var(--orange);font-size:1rem}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:9px}.field b{display:block;color:#64748b;font-size:.75rem;margin-bottom:3px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.photo{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:6px}.photo img{width:100%;height:150px;object-fit:cover;border-radius:7px}.empty{color:#64748b;text-align:center;padding:18px}.parts{width:100%;border-collapse:collapse}.parts th,.parts td{padding:9px;border-bottom:1px solid var(--border);text-align:right}.parts th{background:#fff7ed;color:var(--orange)}@media(max-width:700px){.grid,.info{grid-template-columns:1fr}.full{grid-column:auto}}@media print{.actions{display:none}body{background:#fff;padding:0}.card,.header{break-inside:avoid}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <div><div class="title"><i class="fa-solid fa-car"></i> ملف السيارة - قسم السروجي وتنجيد السيارات - مركز أوتو نون (NON)</div><div class="sub" id="pageSubtitle">جاري تحميل بيانات السيارة...</div></div>
    <div class="actions"><button class="btn blue" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الملف</button><button class="btn green" onclick="shareCurrentPage()"><i class="fa-solid fa-share-nodes"></i> مشاركة الرابط</button></div>
  </div>
  <div id="content"><div class="card"><div class="empty">جاري تحميل الملف...</div></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAo4cdiLNInZoVPA6kFkDUl1tWaxcLVtKk",authDomain:"auto-non-b841f.firebaseapp.com",projectId:"auto-non-b841f",storageBucket:"auto-non-b841f.firebasestorage.app",messagingSenderId:"512423300329",appId:"1:512423300329:web:190310e1c4b80c9921b478",measurementId:"G-ZG5RQBB3GL"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const carId=new URLSearchParams(location.search).get('carId');
const esc=v=>String(v??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function photoSection(title,arr){if(!arr||!arr.length)return `<div class="empty">لا توجد صور مسجلة في هذا القسم.</div>`;return `<div class="photos">${arr.map(x=>`<div class="photo"><img src="${x}" loading="lazy"></div>`).join('')}</div>`}
async function load(){
 if(!carId){document.getElementById('content').innerHTML='<div class="card"><div class="empty">رابط الملف غير صحيح: لا يوجد رقم سيارة.</div></div>';return}
 try{const snap=await db.collection('cars').doc(carId).get();if(!snap.exists)throw new Error('السيارة غير موجودة');const c=snap.data();
 const parts=c.requiredPartsList||[];const services=c.installationServicesList||[];const before=c.beforeMaintenancePhotos||[];const after=c.afterMaintenancePhotos||[];const attachments=c.attachments||[];
 document.getElementById('pageSubtitle').textContent=`${c.name||'عميل'} — ${c.brand||''} ${c.model||''} — لوحة ${c.plate||'غير محددة'}`;
 document.getElementById('content').innerHTML=`
 <div class="grid">
  <div class="card"><h3><i class="fa-solid fa-id-card"></i> بيانات العميل والسيارة</h3><div class="info">
   <div class="field"><b>اسم العميل</b>${esc(c.name||'-')}</div><div class="field"><b>الهاتف</b>${esc(c.phone||c.clientPhone||'-')}</div>
   <div class="field"><b>السيارة</b>${esc((c.brand||'')+' '+(c.model||''))}</div><div class="field"><b>رقم اللوحة</b>${esc(c.plate||'-')}</div>
   <div class="field"><b>Serial No</b>${esc(c.serialNo||c.serialNumber||'-')}</div><div class="field"><b>اللون</b>${esc(c.color||'-')}</div>
   <div class="field"><b>حالة السيارة</b>${esc(c.statusLabel||c.mechanicsItemStatus||c.status||'-')}</div><div class="field"><b>الفني</b>${esc(c.assignedTechnician||c.completedByTechnician||'-')}</div>
  </div></div>
  <div class="card"><h3><i class="fa-solid fa-clipboard-check"></i> التقارير</h3><div class="field"><b>شكوى العميل</b>${esc(c.customerComplaint||c.complaint||c.problem||'-')}</div><br><div class="field"><b>تقرير الفني</b>${esc(c.mechanicsTechNotes||'-')}</div><br><div class="field"><b>نتيجة الاختبار</b>${esc(c.testDriveStatus||'-')}<br>${esc(c.testDriveNotes||'')}</div></div>
  <div class="card full"><h3><i class="fa-solid fa-boxes-stacked"></i> قطع الغيار</h3>${parts.length?`<table class="parts"><thead><tr><th>الصنف</th><th>الكمية</th></tr></thead><tbody>${parts.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.quantityNeeded||1)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد قطع غيار مسجلة.</div>'}</div>
  <div class="card full"><h3><i class="fa-solid fa-wrench"></i> خدمات التركيب</h3>${services.length?`<div>${services.map(s=>`<div class="field" style="margin-bottom:7px"><b>الخدمة</b>${esc(s.name)}</div>`).join('')}</div>`:'<div class="empty">لا توجد خدمات تركيب مسجلة.</div>'}</div>
  <div class="card"><h3><i class="fa-solid fa-camera"></i> صور قبل الصيانة</h3>${photoSection('قبل',before)}</div>
  <div class="card"><h3><i class="fa-solid fa-camera-retro"></i> صور بعد الصيانة</h3>${photoSection('بعد',after)}</div>
  <div class="card full"><h3><i class="fa-solid fa-paperclip"></i> المرفقات الإضافية</h3>${photoSection('مرفقات',attachments)}</div>
 </div>`;
 }catch(e){document.getElementById('content').innerHTML=`<div class="card"><div class="empty">تعذر تحميل الملف: ${esc(e.message)}</div></div>`}
}
async function shareCurrentPage(){try{await navigator.clipboard.writeText(location.href);alert('تم نسخ رابط الملف. يمكنك إرساله للعميل على واتساب.')}catch(e){prompt('انسخ الرابط:',location.href)}}
load();
</script>
</body></html>
